<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div class="app">
    <div class="header">
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <div class="marca" style="font-size:16px;">Reportes</div>
      <a href="menu.html" class="back-link" title="Volver al menú"><span aria-hidden="true">🏠</span> Menú</a>
    </div>

    <div class="contenido">
      <div class="tarjeta" style="text-align:center; padding:40px 20px;">
        <div style="font-size:40px; margin-bottom:10px;">📊</div>
        <div class="titulo-seccion">Reportes en camino</div>
        <div class="subtitulo" style="margin-bottom:0;">
          Aquí vas a poder ver el total de pedidos, ventas por día y por forma de pago.
          Lo armamos en la siguiente etapa.
        </div>
      </div>
    </div>
  </div>

  <!-- Cajón de navegación -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-perfil">
      <div class="drawer-avatar" id="drawerInicial">?</div>
      <div>
        <div class="drawer-nombre" id="drawerNombre">Invitado</div>
        <div class="drawer-etiqueta">Pedidos de hoy</div>
      </div>
    </div>
    <nav class="drawer-nav">
      <a href="menu.html">🍽️ Menú</a>
      <a href="usuario.html">🔄 Cambiar usuario / pago</a>
      <a href="productos.html">🧾 Gestionar productos</a>

      <a href="historial.html">🕘 Historial</a>
      <a href="reportes.html" class="activo">📊 Reportes</a>
    </nav>
    <div class="drawer-pie">
      <button class="btn btn-fantasma" style="width:100%; text-align:left;" onclick="cerrarSesion()">Cerrar sesión en este dispositivo</button>
    </div>
  </div>

  <script src="app-common.js"></script>
  <script>
    exigirSesion();
    function cerrarSesion() {
      if (confirm('¿Cerrar sesión en este dispositivo?')) {
        Sesion.cerrar();
        window.location.href = 'index.html';
      }
    }
    iniciarCajonNavegacion();
